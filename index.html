<style>
:root{
  --bg:#0f1115; --surface:#181b22; --surface2:#20242d; --line:#2b303b;
  --ink:#f2f4f7; --ink2:#b4bac6; --muted:#7d8492;
  --accent:#c6f432; --accentInk:#151a05;
  --def:#3ccfb4; --sur:#ff8a4c; --danger:#ff5d5d;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;margin:0}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.tile .val{font-family:"Barlow Condensed";font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.tile .val small{font-family:Inter;font-size:13px;color:var(--ink2);font-weight:500}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--surface2);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accentInk)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #4a2a2a}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.icon{background:var(--surface2);border:0;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 8px;cursor:pointer;min-width:58px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;margin:0 6px 6px 0}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.tag{font-size:11px;color:var(--ink2);background:var(--surface2);border-radius:6px;padding:2px 7px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.setrow .n{color:var(--muted);text-align:center;font-weight:600}
.setrow input{text-align:center;padding:10px 4px}
.check{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.setrow.done input{border-color:#4c5a1c}
.hint{font-size:12px;color:var(--ink2);margin-top:4px}
.hint.up{color:var(--accent)}
.colhead{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;font-size:11px;color:var(--muted);text-align:center;margin-top:10px;text-transform:uppercase;letter-spacing:.5px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));background:var(--accent);color:var(--accentInk);border-radius:999px;padding:10px 14px 10px 18px;display:flex;gap:12px;align-items:center;font-weight:700;z-index:25;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.timer button{background:rgba(0,0,0,.15);border:0;border-radius:999px;padding:6px 10px;font-weight:700;color:inherit;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.big{font-family:"Barlow Condensed";font-size:44px;font-weight:700;line-height:1}
.pos{color:var(--sur)} .neg{color:var(--def)}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:14px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-120%);display:none;font-weight:600}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px}
.sync{font-size:11px;color:var(--muted)}
.mus{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:17px;flex:none}
ul.tips{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14px;line-height:1.5}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;color:var(--ink2);font-weight:600;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.photo-prev{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:10px;display:block}
.airow{display:grid;grid-template-columns:28px 1fr 64px 56px;gap:6px;align-items:center;margin-top:8px}
.airow input{padding:8px 6px;font-size:14px}
.airow input[type=checkbox]{width:22px;height:22px;accent-color:#c6f432}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
ol.steps{padding-left:18px;color:var(--ink2);font-size:14px;line-height:1.55;margin:8px 0}
</style>
</head>

function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cacheAll(){lsSet(LS_KEY,S)}

const writing={}; const pendingW={};
async function writeDoc(key,obj){
  cacheAll();
  if(!coll) return;
  if(writing[key]){pendingW[key]=obj;return}
  writing[key]=true;
  try{ obj===null ? await coll.doc(key).delete() : await coll.doc(key).set(JSON.parse(JSON.stringify(obj))); }
  catch(e){ if(e&&e.code==="quota_exceeded") toast("Sin espacio en la nube: borra historial antiguo"); else if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{obj===null?await coll.doc(key).delete():await coll.doc(key).set(JSON.parse(JSON.stringify(obj)))}catch(_){}} }
  writing[key]=false;
  if(key in pendingW){const n=pendingW[key]; delete pendingW[key]; writeDoc(key,n)}
}

async function initCloud(){
  try{
    if(!window.claude||!claude.use) return setSync("Guardado en este iPhone · haz copia de vez en cuando");
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return setSync("Guardado en este iPhone · haz copia de vez en cuando");
    uid=await u.id(); if(!uid) return setSync("Guardado en este iPhone · haz copia de vez en cuando");
    db=d; coll=db.collection("data/users/"+uid);
    setSync("Conectando…");
    const t=setTimeout(()=>{if(!synced)setSync("Sin conexión: se guarda en el móvil")},10000);
    let first=true;
    coll.onSnapshot(snap=>{
      if(snap.metadata.fromCache && snap.empty) return;
      if(!snap.metadata.fromCache){clearTimeout(t);synced=true;setSync("Sincronizado en la nube ✓")}
      if(first && !snap.metadata.fromCache && snap.empty){
        first=false;
        // primera vez: sube lo que hubiera en el móvil
        if(S.main.profile||S.main.routines.length){ saveMain(); Object.values(S.workouts).forEach(w=>writeDoc("w_"+w.id,w)); Object.keys(S.food).forEach(k=>writeDoc("f_"+k,S.food[k])); }
        return;
      }
      if(!snap.metadata.fromCache) first=false;
      const n={main:{profile:null,routines:[],bw:[],tdeeAdj:0},workouts:{},food:{}};
      snap.docs.forEach(doc=>{const v=doc.data(); if(!v)return;
        if(doc.id==="main") n.main=Object.assign(n.main,v);
        else if(doc.id.startsWith("w_")) n.workouts[v.id]=v;
        else if(doc.id.startsWith("f_")) n.food[v.date]=v;});
      S=n; cacheAll(); if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render();
    },err=>{clearTimeout(t);setSync("Guardado en este iPhone · haz copia de vez en cuando")});
  }catch(e){setSync("Guardado en este iPhone · haz copia de vez en cuando")}
}

function setSync(m){syncMsg=m;const el=document.getElementById("sync");if(el)el.textContent=m}

/* ================== UTILIDADES ================== */
function fmtRest(s){return s>=60?(s%60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" min":s/60+" min"):s+" s"}
function progInfo(){const P=S.main.program;if(!P)return null;const days=Math.floor((new Date(today()+"T12:00:00")-new Date(P.start+"T12:00:00"))/864e5);const wk=Math.floor(days/7)+1;return{wk,W:WEEKS[Math.min(7,Math.max(0,wk-1))],done:wk>8,before:days<0}}
function todayPlan(){const P=progInfo();if(!P||P.done||P.before)return null;const dow=new Date().getDay();const r=S.main.routines.find(x=>x.day===dow);if(r)return{type:"gym",r};if(dow===3)return{type:"z2"};if(dow===6)return{type:"int"};return{type:"rest"}}
function today(){const d=new Date();return ymd(d)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)}
function fmtDate(s,opt){return new Date(s+"T12:00:00").toLocaleDateString("es-ES",opt||{weekday:"short",day:"numeric",month:"short"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uidGen(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function num(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n}
function r0(n){return Math.round(n)}
function e1rm(w,r){if(!w||!r)return 0;return r===1?w:w*(1+r/30)}
function exName(id){return EX[id]?EX[id].n:(S.main.customEx&&S.main.customEx[id])||id}
function exMuscle(id){return EX[id]?EX[id].m:"Otro"}
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function topReps(s){const p=String(s).split("-").map(x=>parseInt(x));return p[p.length-1]||0}
function lowReps(s){return parseInt(String(s))||0}

function latestBW(){const b=[...(S.main.bw||[])].sort((a,b)=>a.d<b.d?-1:1);return b.length?b[b.length-1].w:(S.main.profile?S.main.profile.peso:null)}
function calc(){
  const p=S.main.profile; if(!p) return null;
  const w=latestBW()||p.peso;
  const bmr=10*w+6.25*p.altura-5*p.edad+(p.sexo==="h"?5:-161);
  const tdee=bmr*p.act;
  const goal=tdee+(GOALS[p.obj]?GOALS[p.obj][0]:0);
  return {bmr:r0(bmr),tdee:r0(tdee),goal:r0(goal),w};
}
function dayTotals(d){const f=S.food[d];if(!f)return{kcal:0,p:0,extra:0,n:0};return{kcal:f.items.reduce((a,i)=>a+(+i.kcal||0),0),p:f.items.reduce((a,i)=>a+(+i.p||0),0),extra:+f.extra||0,n:f.items.length}}
function workoutsSorted(){return Object.values(S.workouts).sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.end||0)-(a.end||0))}
function lastFor(ex,excludeId){for(const w of workoutsSorted()){if(w.id===excludeId)continue;const it=w.items.find(i=>i.ex===ex&&i.sets.some(s=>s.done!==false&&num(s.r)));if(it)return{w,it}}return null}
function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return ymd(d)}

function vHoy(){
  const c=calc(); const t=dayTotals(today());
  const wk=Object.values(S.workouts).filter(w=>w.date>=weekStart()).length;
  const next=nextRoutine();
  let h=`<div class="top"><div><div class="sub">${fmtDate(today(),{weekday:"long",day:"numeric",month:"long"})}</div><h1>Mi Entrenador</h1></div><button class="icon" data-act="profile" aria-label="Perfil">⚙️</button></div>`;
  if(!S.main.profile){
    h+=`<div class="card"><h2>Empecemos 👋</h2><p class="sub" style="font-size:14px">Rellena tu perfil para calcular tus calorías de mantenimiento y saber si estás en déficit.</p><button class="btn pri block" data-act="profile">Crear mi perfil</button></div>`;
  }
  const tp=todayPlan(); h+=progCard();
  if(ACTIVE){h+=`<div class="card" style="border-color:var(--accent)"><div class="row between"><div><div class="sub">Entreno en curso</div><h2>${esc(ACTIVE.name)}</h2></div><button class="btn pri" data-act="goActive">Continuar</button></div></div>`}
  else if(tp&&tp.type!=="gym"){h+=planCard(tp)}
  else if(next){h+=`<div class="card"><div class="sub">${tp?"Hoy toca":"Siguiente entreno sugerido"}</div><div class="row between" style="margin-top:4px"><h2>${esc(next.name)}</h2><button class="btn pri" data-act="start" data-v="${next.id}">Empezar</button></div><div class="sub" style="margin-top:6px">${next.items.map(i=>esc(exName(i.ex))).join(" · ")}</div></div>`}
  else if(S.main.profile){h+=`<div class="card"><h3>Aún no tienes rutinas</h3><p class="sub">Elige una plantilla para empezar.</p><button class="btn pri block" data-act="tab" data-v="entrenar">Elegir rutina</button></div>`}
  if(c){
    const bal=t.kcal-(c.tdee+t.extra); const left=c.goal+t.extra-t.kcal; const pct=Math.min(100,t.kcal/(c.goal+t.extra)*100);
    h+=`<div class="card" data-act="tab" data-v="comida" style="cursor:pointer"><div class="row between"><div class="sub">Calorías de hoy</div><span class="tag">objetivo ${c.goal+t.extra} kcal</span></div>
      <div class="row between" style="margin-top:8px;align-items:flex-end"><div><span class="big">${t.kcal}</span> <span class="sub">kcal</span></div><div style="text-align:right"><div class="sub">${left>=0?"Te quedan":"Te has pasado"}</div><b>${Math.abs(left)} kcal</b></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub" style="margin-top:8px">${t.n?(bal<0?`<span class="neg">Déficit de ${-bal} kcal</span> respecto a tu mantenimiento`:`<span class="pos">Superávit de ${bal} kcal</span> respecto a tu mantenimiento`):"Aún no has apuntado comida hoy"}</div></div>`;
  }
  h+=`<div class="grid2"><div class="tile"><div class="lbl">Entrenos semana</div><div class="val">${wk}</div></div><div class="tile"><div class="lbl">Peso actual</div><div class="val">${latestBW()?latestBW()+" <small>kg</small>":"—"}</div></div>`;
  if(c) h+=`<div class="tile"><div class="lbl">Mantenimiento</div><div class="val">${c.tdee} <small>kcal</small></div></div><div class="tile"><div class="lbl">Balance 7 días</div><div class="val">${weekBalanceStr(c)}</div></div>`;
  h+=`</div><p class="sync" style="text-align:center;margin-top:16px" id="sync">${esc(syncMsg)}</p>`;
  return h;
}
function progCard(full){
  const P=progInfo();if(!P)return"";
  if(P.done)return `<div class="card"><h3>🏁 Programa de 8 semanas completado</h3><p class="sub">Haz tus fotos finales y compara. ¿Otra ronda?</p><button class="btn pri block" data-act="progRestart">Empezar otra vez (semana 1)</button></div>`;
  if(P.before)return `<div class="card"><h3>Tu programa empieza el ${fmtDate(S.main.program.start,{weekday:"long",day:"numeric",month:"long"})}</h3></div>`;
  const W=P.W;const done=Object.values(S.workouts).filter(w=>w.date>=weekStart());
  const gym=done.filter(w=>w.type!=="cardio").length,car=done.filter(w=>w.type==="cardio").length;
  return `<div class="card" ${full?"":'data-act="tab" data-v="entrenar" style="cursor:pointer"'}><div class="row between" style="align-items:flex-end"><div><div class="sub">Recomposición · semana ${P.wk} de 8</div><h2>${W.f}${W.deload?" 🧘":""}</h2></div><div style="text-align:right;font-size:12px;color:var(--ink2);line-height:1.4">pesas ${gym}/4<br>cardio ${car}/2</div></div>
  <div class="bar"><i style="width:${(P.wk-1)/8*100+ (new Date().getDay()+6)%7/56*100}%"></i></div>
  <div class="sub" style="margin-top:8px;line-height:1.5">🏋️ ${W.p}<br>🏃 Zona 2: ${W.z2} min · Sábado: ${W.int}${P.wk===1||P.wk===4||P.wk===8?"<br>📸 Esta semana toca hacer fotos de frente y perfil":""}</div>
  ${full?`<details style="margin-top:10px"><summary class="sub">▸ Ajustes del programa</summary><label class="f">Fecha de inicio (lunes de la semana 1)</label><input type="date" id="pstart" value="${S.main.program.start}"><button class="btn sm danger" style="margin-top:10px" data-act="progStop">Quitar calendario del programa</button></details>`:""}</div>`;
}
function planCard(tp){

  if(tp.type==="z2")return `<div class="card"><div class="sub">Hoy toca</div><h2>Cardio suave · Zona 2</h2><p class="sub" style="line-height:1.5"><b style="color:var(--ink)">${W.z2} min</b> al aire libre: correr suave, bici o caminar rápido en cuesta. Ritmo al que puedes hablar en frases completas, pero no cantar.</p><button class="btn pri block" data-act="cardio" data-v="Zona 2" data-m="${W.z2}">Hecho ✓</button></div>`;

function weekBalanceStr(c){let s=0,n=0;for(let i=0;i<7;i++){const d=addDays(today(),-i);const t=dayTotals(d);if(t.n){s+=t.kcal-(c.tdee+t.extra);n++}}if(!n)return"—";return `<span class="${s<0?"neg":"pos"}">${s>0?"+":""}${s}</span> <small>kcal</small>`}
function nextRoutine(){const tp=todayPlan();if(tp&&tp.type==="gym")return tp.r;const R=S.main.routines;if(!R.length)return null;const last=workoutsSorted().find(w=>w.routineId);if(!last)return R[0];const i=R.findIndex(r=>r.id===last.routineId);return R[(i+1)%R.length]}

  if(ACTIVE) return vActive();
  let h=`<div class="top"><h1>Entrenar</h1></div>`;

  if(!R.length){
    h+=`<div class="card"><h2>Elige un plan para empezar</h2><p class="sub">Luego puedes cambiar ejercicios, series y repeticiones.</p>${Object.entries(TEMPLATES).map(([k,t])=>`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><div class="row between"><div><b>${t.name}</b><div class="sub">${t.routines.map(r=>r.name).join(" · ")}</div></div><button class="btn sm pri" data-act="useTpl" data-v="${k}">Usar</button></div></div>`).join("")}

  });

function histHtml(){
  const W=workoutsSorted(); if(!W.length) return "";
  return `<h2 style="margin:18px 0 10px">Historial</h2>`+W.slice(0,30).map(w=>{
    const vol=w.items.reduce((a,i)=>a+i.sets.reduce((b,s)=>b+(num(s.w)||0)*(num(s.r)||0),0),0);
    return `<details class="card"><summary><div class="row between"><div><b>${esc(w.name)}</b><div class="sub">${fmtDate(w.date)}${w.dur?" · "+w.dur+" min":""}${w.type==="cardio"?" · cardio":" · "+r0(vol)+" kg volumen"}</div></div><span class="sub">▾</span></div></summary>
    <div style="margin-top:10px">${w.items.map(i=>`<div style="margin-top:6px"><b style="font-size:14px">${esc(exName(i.ex))}</b><div class="sub">${i.sets.filter(s=>num(s.r)).map(s=>`${num(s.w)||0}kg×${num(s.r)}`).join(" · ")||"—"}</div></div>`).join("")}

function finishWorkout(){
  const A=ACTIVE;
  A.items.forEach(it=>it.sets.forEach(s=>{ if(!s.w&&s.pw&&s.done) s.w=s.pw; if(!s.r&&s.done) s.r=s.pr||lowReps(it.target)||""; }));
  const items=A.items.map(it=>({ex:it.ex,target:it.target,sets:it.sets.filter(s=>num(s.r)).map(s=>({w:num(s.w)||0,r:num(s.r)}))})).filter(i=>i.sets.length);
  if(!items.length){confirmDlg("No has apuntado ninguna serie. ¿Descartar el entreno?","Descartar",()=>{ACTIVE=null;lsSet(LS_ACTIVE,null);stopTimer();render()});return}

  const prs=items.filter(it=>{const best=Math.max(...it.sets.map(s=>e1rm(s.w,s.r)));let prev=0;Object.values(S.workouts).forEach(o=>o.items.forEach(i=>{if(i.ex===it.ex)i.sets.forEach(s=>{prev=Math.max(prev,e1rm(s.w,s.r))})}));return prev>0&&best>prev}).map(i=>exName(i.ex));

  openModal(`<div style="text-align:center"><div style="font-size:48px">🔥</div><h2>¡Entreno guardado!</h2><p class="sub">${w.dur} min · ${items.length} ejercicios · ${items.reduce((a,i)=>a+i.sets.length,0)} series</p>${prs.length?`<div class="card" style="text-align:left"><b>🏆 Nuevos récords</b><div class="sub">${prs.map(esc).join("<br>")}</div></div>`:""}<button class="btn pri block" data-act="closeModal">Genial</button></div>`);

function weekChartCard(c){

function resizeImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const m=1280;const sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
async function photoGo(){
  if(!navigator.onLine){toast("Necesitas conexión a internet para analizar la foto");return}
  drawPhoto("loading");
  const prompt=`Eres un nutricionista experto. Estima las calorías y la proteína del plato de la foto.
Identifica cada alimento visible y estima su cantidad en gramos usando como referencia el tamaño del plato, los cubiertos y otros objetos. Incluye el aceite, mantequilla o salsas que probablemente lleve por cómo está cocinado. Usa valores nutricionales estándar de alimentos cocinados en España.
Nota del usuario (si la hay, tiene prioridad sobre lo que veas): ${PH.note||"ninguna"}
Responde SOLO con JSON válido, sin texto antes ni después, con este formato:
{"plato":"nombre corto en español","items":[{"nombre":"alimento","gramos":0,"kcal":0,"proteina":0}],"confianza":"alta|media|baja","comentario":"una frase breve sobre lo que más incertidumbre añade"}
Si en la foto no hay comida, devuelve {"plato":"","items":[],"confianza":"baja","comentario":"No veo comida en la foto"}.`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":getKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:AI_MODEL,max_tokens:1200,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:PH.img.split(",")[1]}},{type:"text",text:prompt}]}]})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok){const m=(data.error&&data.error.message)||"";
      throw new Error(r.status===401?"La clave no es válida. Revísala en ⚙️ → Fotos de comida con IA.":/credit|balance|billing/i.test(m)?"No te queda saldo en console.anthropic.com (Billing).":r.status===429?"Demasiadas peticiones seguidas. Espera un momento.":r.status>=500||r.status===529?"El servicio está saturado ahora mismo. Prueba en un minuto.":"Error "+r.status+": "+m)}
    const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    const j=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));
    PH.items=(j.items||[]).map(i=>({nombre:String(i.nombre||"Alimento"),gramos:r0(+i.gramos||0),kcal:r0(+i.kcal||0),proteina:r0(+i.proteina||0),on:true}));
    PH.plato=j.plato||"Plato (foto)";PH.com=j.comentario||"";PH.conf=j.confianza||"";
    drawPhoto();
  }catch(e){drawPhoto();toast(e&&e.message&&!/JSON|Unexpected/.test(e.message)?e.message:(e instanceof TypeError?"Sin conexión con el servicio. Revisa internet.":"No he entendido la respuesta. Prueba otra vez."))}
}
function photoAdd(){const on=PH.items.filter(i=>i.on);if(!on.length){toast("Marca al menos un alimento");return}
  const name=(document.getElementById("phName").value||"Plato").trim();
  addFood({name:"📷 "+name,kcal:on.reduce((a,i)=>a+(+i.kcal||0),0),p:r0(on.reduce((a,i)=>a+(+i.proteina||0),0)),detail:on.map(i=>i.nombre).join(", ")});
  PH=null;closeModal();toast("Añadido ✓")}

/* ================== PROGRESO ================== */
function vProgreso(){
  let h=`<div class="top"><h1>Progreso</h1></div><div class="seg"><button class="${UI.progView==="ejercicios"?"on":""}" data-act="pview" data-v="ejercicios">Ejercicios</button><button class="${UI.progView==="peso"?"on":""}" data-act="pview" data-v="peso">Peso corporal</button></div>`;
  if(UI.progView==="peso") return h+vPeso();
  const exs={};workoutsSorted().forEach(w=>w.items.forEach(i=>{exs[i.ex]=(exs[i.ex]||0)+1}));
  const keys=Object.keys(exs).sort((a,b)=>exs[b]-exs[a]);
  if(!keys.length) return h+`<div class="card empty">Cuando completes tu primer entreno, aquí verás cómo suben tus pesos 📈</div>`;
  if(!UI.progEx||!exs[UI.progEx]) UI.progEx=keys[0];
  h+=`<select id="pex" style="margin-bottom:12px">${keys.map(k=>`<option value="${k}" ${k===UI.progEx?"selected":""}>${esc(exName(k))} (${exs[k]})</option>`).join("")}</select>`;
  const hist=[];workoutsSorted().slice().reverse().forEach(w=>{const it=w.items.find(i=>i.ex===UI.progEx);if(it){const best=it.sets.reduce((a,s)=>e1rm(s.w,s.r)>e1rm(a.w,a.r)?s:a,it.sets[0]);hist.push({d:w.date,max:Math.max(...it.sets.map(s=>s.w)),e:Math.round(e1rm(best.w,best.r)*10)/10,sets:it.sets,vol:it.sets.reduce((a,s)=>a+s.w*s.r,0)})}});
  const bestW=Math.max(...hist.map(x=>x.max)),bestE=Math.max(...hist.map(x=>x.e));
  const first=hist[0],last=hist[hist.length-1];const diff=last.e-first.e;
  h+=`<div class="grid2" style="margin-bottom:12px"><div class="tile"><div class="lbl">Peso máximo</div><div class="val">${bestW} <small>kg</small></div></div><div class="tile"><div class="lbl">1RM estimado</div><div class="val">${bestE} <small>kg</small></div></div></div>`;
  h+=`<div class="card"><div class="row between"><h3>1RM estimado</h3>${hist.length>1?`<span class="sub">${diff>=0?"+":""}${diff.toFixed(1)} kg desde el inicio</span>`:""}</div><div class="chart" id="exchart" style="margin-top:8px"></div><p class="sub" style="font-size:12px">Toca la gráfica para ver cada sesión. El 1RM estimado combina peso y repeticiones (fórmula de Epley).</p></div>`;
  h+=`<div class="card"><h3>Sesiones</h3><div class="list">${hist.slice().reverse().map(x=>`<div><div class="row between"><b>${fmtDate(x.d)}</b><span class="sub">${r0(x.vol)} kg vol.</span></div><div class="sub">${x.sets.map(s=>`${s.w}×${s.r}`).join(" · ")}</div></div>`).join("")}</div></div>`;
  after(()=>{document.getElementById("pex").onchange=e=>{UI.progEx=e.target.value;render()};lineChart("exchart",hist.map(x=>({x:x.d,y:x.e})),"kg")});
  return h;
}
function vPeso(){
  const B=[...(S.main.bw||[])].sort((a,b)=>a.d<b.d?-1:1);
  let h=`<div class="card"><form id="bwf"><div class="row"><input name="w" type="number" step="0.1" inputmode="decimal" placeholder="Peso kg"><input name="c" type="number" step="0.1" inputmode="decimal" placeholder="Cintura cm"><button class="btn pri">Guardar</button></div><div class="sub" style="margin-top:6px">Pésate 3–4 mañanas por semana en ayunas. La cintura, cada domingo a la altura del ombligo.</div></form></div>`;
  if(B.length){const ch=B.length>1?B[B.length-1].w-B[0].w:0;
    const wk=B.filter(b=>b.d>addDays(today(),-7)&&b.w);const avg=wk.length?wk.reduce((a,b)=>a+b.w,0)/wk.length:null;
    const C=B.filter(b=>b.c);const cch=C.length>1?C[C.length-1].c-C[0].c:null;
    h+=`<div class="grid2" style="margin-bottom:12px"><div class="tile"><div class="lbl">Media 7 días</div><div class="val">${avg?avg.toFixed(1):"—"} <small>kg</small></div></div><div class="tile"><div class="lbl">Cambio total</div><div class="val">${ch>0?"+":""}${ch.toFixed(1)} <small>kg</small></div></div>
    <div class="tile"><div class="lbl">Cintura</div><div class="val">${C.length?C[C.length-1].c:"—"} <small>cm</small></div></div><div class="tile"><div class="lbl">Cambio cintura</div><div class="val">${cch===null?"—":(cch>0?"+":"")+cch.toFixed(1)} <small>cm</small></div></div></div>`;
    if(B.filter(b=>b.w).length>1){h+=`<div class="card"><h3>Peso</h3><div class="chart" id="bwchart" style="margin-top:8px"></div></div>`;after(()=>lineChart("bwchart",B.filter(b=>b.w).map(b=>({x:b.d,y:b.w})),"kg"))}
    if(C.length>1){h+=`<div class="card"><h3>Cintura</h3><p class="sub" style="margin:2px 0 0">En recomposición el peso apenas se mueve: la cintura es la que manda.</p><div class="chart" id="cchart" style="margin-top:8px"></div></div>`;after(()=>lineChart("cchart",C.map(b=>({x:b.d,y:b.c})),"cm"))}
    h+=`<div class="card"><div class="list">${B.slice().reverse().map(b=>`<div class="row between"><span>${fmtDate(b.d)}</span><div class="row"><b>${b.w} kg${b.c?` · ${b.c} cm`:""}</b><button class="icon" data-act="delBW" data-v="${b.d}">✕</button></div></div>`).join("")}</div></div>`;
  } else h+=`<div class="card empty">Pésate una vez por semana, a la misma hora y en ayunas, para ver la tendencia real.</div>`;
  after(()=>{document.getElementById("bwf").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const w=num(fd.get("w")),c=num(fd.get("c"));if(!w&&!c)return;const old=(S.main.bw||[]).find(b=>b.d===today())||{};S.main.bw=(S.main.bw||[]).filter(b=>b.d!==today());const n={d:today(),w:w||old.w||latestBW()};if(c||old.c)n.c=c||old.c;S.main.bw.push(n);saveMain();render();toast("Peso guardado ✓")}});
  return h;
}

/* ================== GUÍA ================== */
function vGuia(){
  let h=`<div class="top"><h1>Guía</h1></div>
  <details class="card" open><summary class="row between"><b>⭐ Mi programa: recomposición 8 semanas</b><span class="sub">▾</span></summary><ul class="tips">
   <li><b>Semana tipo:</b> L Torso A · M Pierna A · X Zona 2 · J Torso B · V Pierna B · S Intervalos o deporte · D Descanso.</li>
   <li><b>Días A</b> pesados (pocas reps, más descanso); <b>días B</b> de volumen. RIR = repeticiones que te quedan en reserva al acabar.</li>
   <li><b>Doble progresión:</b> cuando hagas todas las series en el tope del rango, sube 2,5 kg en torso o 5 kg en pierna y vuelve al mínimo de reps. La app te lo avisa en cada ejercicio.</li>
   <li><b>Bloques:</b> semanas 1–3 de carga, 4 de descarga, 5–7 de carga y 8 de descarga y test de 5RM en banca y sentadilla.</li>
   <li><b>Calorías:</b> mantenimiento, unas 2.900 kcal (2.800–3.000). Los días de deporte, suma 200–300 kcal.</li>
   <li><b>Macros:</b> proteína 150–165 g, grasas 60–75 g, carbohidratos 390–430 g; carbohidratos sobre todo antes y después de entrenar.</li>
   <li><b>Cada día:</b> 8.000–10.000 pasos, 7–9 h de sueño y unos 35 ml de agua por kg.</li>
   <li><b>Cada 3 semanas:</b> si la cintura sube, quita 150–200 kcal; si no cambia y los pesos se estancan, añade 150–200 kcal.</li>
   <li><b>Baja el ritmo</b> si la fuerza cae dos sesiones seguidas, duermes peor o estás sin energía: adelanta la descarga o sube 200 kcal esa semana. Si una articulación duele, cambia a una variante que no moleste.</li>
  </ul></details>
  <details class="card"><summary class="row between"><b>📘 Principios básicos</b><span class="sub">▾</span></summary><ul class="tips">
   <li><b>Sobrecarga progresiva:</b> cuando completes todas las series en lo alto del rango de reps, sube 2,5 kg (o 1-2 kg en ejercicios pequeños). La app te avisa.</li>
   <li><b>Rango de reps:</b> 5-8 para fuerza, 8-12 para músculo, 12-20 para ejercicios de aislamiento.</li>
   <li><b>Descansos:</b> 2-3 min en ejercicios grandes (sentadilla, banca, peso muerto), 60-90 s en el resto.</li>
   <li><b>Intensidad:</b> termina cada serie dejando 1-3 repeticiones "en la recámara".</li>
   <li><b>Calienta:</b> 5 min de cardio suave y 2-3 series ligeras del primer ejercicio.</li>
   <li><b>Volumen:</b> 10-20 series semanales por grupo muscular es un buen objetivo.</li>
  </ul></details>
  <details class="card"><summary class="row between"><b>🍽️ Déficit y nutrición</b><span class="sub">▾</span></summary><ul class="tips">
   <li>Tu <b>mantenimiento</b> se calcula con la fórmula Mifflin-St Jeor y tu nivel de actividad. Es una estimación: ajústala mirando tu peso semanal.</li>
   <li>Si comes menos que tu mantenimiento estás en <b>déficit</b>. ~7.700 kcal de déficit ≈ 1 kg de grasa.</li>
   <li>Un déficit de 300-500 kcal/día es sostenible y protege el músculo.</li>
   <li>Proteína: 1,6-2,2 g por kg de peso al día.</li>
   <li>Si en 2-3 semanas tu peso no baja, reduce 150-200 kcal o sube el nivel de actividad en el perfil.</li>
  </ul></details>
  <input id="gq" placeholder="Buscar ejercicio…" value="${esc(UI.guideQ)}" style="margin-bottom:10px">
  <div style="margin-bottom:8px">${Object.keys(MUSCLE_ICON).map(m=>`<span class="chip ${UI.guideM===m?"on":""}" data-act="gm" data-v="${m}">${MUSCLE_ICON[m]} ${m}</span>`).join("")}</div>`;
  const q=UI.guideQ.toLowerCase();
  const list=Object.entries(EX).filter(([k,e])=>(!UI.guideM||e.m===UI.guideM)&&(!q||e.n.toLowerCase().includes(q)));
  h+=list.map(([k,e])=>`<details class="card"><summary class="row" style="gap:12px"><span class="mus">${MUSCLE_ICON[e.m]}</span><div style="flex:1"><b>${e.n}</b><div class="sub">${e.m}</div></div><span class="sub">▾</span></summary><ul class="tips">${e.t.map(x=>`<li>${x}</li>`).join("")}</ul></details>`).join("")||'<div class="empty">Sin resultados</div>';
  after(()=>{const g=document.getElementById("gq");g.oninput=e=>{UI.guideQ=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("gq");n.focus();n.setSelectionRange(pos,pos)}});
  return h;
}

/* ================== GRÁFICAS ================== */
function lineChart(id,pts,unit){
  const el=document.getElementById(id);if(!el)return;
  if(pts.length<2){el.innerHTML='<div class="empty">Necesitas al menos 2 sesiones para ver la gráfica</div>';return}
  const W=340,H=170,pl=36,pr=10,pt=12,pb=24;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  const X=i=>pl+(W-pl-pr)*(pts.length===1?.5:i/(pts.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const ticks=[0,.5,1].map(f=>mn+(mx-mn)*f);
  const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=path+` L${X(pts.length-1)} ${H-pb} L${X(0)} ${H-pb} Z`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de evolución">
   <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6f432" stop-opacity=".25"/><stop offset="1" stop-color="#c6f432" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#2b303b" stroke-width="1"/><text x="${pl-6}" y="${Y(t)+4}" fill="#7d8492" font-size="10" text-anchor="end">${Math.round(t)}</text>`).join("")}
   <text x="${pl}" y="${H-6}" fill="#7d8492" font-size="10">${fmtDate(pts[0].x,{day:"numeric",month:"short"})}</text>
   <text x="${W-pr}" y="${H-6}" fill="#7d8492" font-size="10" text-anchor="end">${fmtDate(pts[pts.length-1].x,{day:"numeric",month:"short"})}</text>
   <path d="${area}" fill="url(#g${id})"/><path d="${path}" fill="none" stroke="#c6f432" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.length<=24?pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="#c6f432" stroke="#181b22" stroke-width="2"/>`).join(""):""}
   <line id="${id}x" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#b4bac6" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
   <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="${id}hit"/></svg><div class="tip" id="${id}tip"></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),xl=document.getElementById(id+"x");
  const move=ev=>{const r=svg.getBoundingClientRect();const cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
    let bi=0,bd=1e9;pts.forEach((p,i)=>{const d=Math.abs(X(i)-cx);if(d<bd){bd=d;bi=i}});
    const p=pts[bi];xl.setAttribute("x1",X(bi));xl.setAttribute("x2",X(bi));xl.style.display="";
    tip.style.display="block";tip.style.left=(X(bi)/W*r.width)+"px";tip.style.top=(Y(p.y)/H*r.height)+"px";tip.textContent=`${fmtDate(p.x,{day:"numeric",month:"short"})} · ${p.y} ${unit}`};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",()=>{tip.style.display="none";xl.style.display="none"});
}
function barChart(id,days){
  const el=document.getElementById(id);if(!el)return;
  const W=340,H=150,pt=10,pb=22,pl=8,pr=8;const vals=days.map(d=>d.v||0);const m=Math.max(200,...vals.map(Math.abs));
  const zero=pt+(H-pt-pb)/2;const sc=(H-pt-pb)/2/m;const bw=(W-pl-pr)/7;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance calórico últimos 7 días">
  ${days.map((d,i)=>{const x=pl+i*bw+bw*.22,w=bw*.56;let bar="";if(d.v!==null){const h=Math.max(2,Math.abs(d.v)*sc);const y=d.v<0?zero:zero-h;bar=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${d.v<0?"#3ccfb4":"#ff8a4c"}"/><rect x="${pl+i*bw}" y="0" width="${bw}" height="${H}" fill="transparent"><title>${fmtDate(d.d)}: ${d.v>0?"+":""}${d.v} kcal</title></rect>`}
   return bar+`<text x="${x+w/2}" y="${H-6}" fill="${d.d===today()?"#f2f4f7":"#7d8492"}" font-size="10" text-anchor="middle">${fmtDate(d.d,{weekday:"narrow"})}</text>`}).join("")}
  <line x1="${pl}" x2="${W-pr}" y1="${zero}" y2="${zero}" stroke="#7d8492" stroke-width="1"/></svg><div class="tip"></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector(".tip");
  svg.addEventListener("pointerdown",ev=>{const r=svg.getBoundingClientRect();const i=Math.min(6,Math.max(0,Math.floor(((ev.clientX-r.left)/r.width*W-pl)/bw)));const d=days[i];if(d.v===null){tip.style.display="none";return}
    tip.style.display="block";tip.style.left=((pl+i*bw+bw/2)/W*r.width)+"px";tip.style.top=(zero/H*r.height)+"px";tip.textContent=`${fmtDate(d.d)}: ${d.v>0?"+":""}${d.v} kcal`});
}

/* ================== EVENTOS ================== */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==="bgClose"){if(e.target===el)closeModal();return}
  const A={
    tab:()=>{UI.tab=v;closeModal();render();window.scrollTo(0,0)},
    profile:openProfile, closeModal, goActive:()=>{UI.tab="entrenar";render()},
    start:()=>{if(ACTIVE){UI.tab="entrenar";render();return}startWorkout(v)},
    useTpl:()=>useTemplate(v), newRoutine:()=>editRoutine(null), editRoutine:()=>editRoutine(v),
    mvEx:()=>{const k=+v,d=+el.dataset.d,j=k+d;if(j<0||j>=EDIT.items.length)return;[EDIT.items[k],EDIT.items[j]]=[EDIT.items[j],EDIT.items[k]];drawEdit()},
    delEx:()=>{EDIT.items.splice(+v,1);drawEdit()},
    saveRoutine:()=>{EDIT.name=(EDIT.name||"").trim()||"Rutina";const isNew=EDIT.isNew;delete EDIT.isNew;
      if(isNew)S.main.routines.push(EDIT);else S.main.routines=S.main.routines.map(r=>r.id===EDIT.id?EDIT:r);saveMain();closeModal();render()},
    delRoutine:()=>{const id=EDIT.id;confirmDlg("¿Borrar esta rutina?","Borrar",()=>{S.main.routines=S.main.routines.filter(r=>r.id!==id);saveMain();render()})},
    pickEx:()=>pickEx(v), pickOne:()=>pickedEx(v),
    pickCustom:()=>{const n=document.getElementById("customName").value.trim();if(!n)return;const k="c_"+uidGen();S.main.customEx=Object.assign({},S.main.customEx,{[k]:n});saveMain();pickedEx(k)},
    tick:()=>{const s=ACTIVE.items[+el.dataset.i].sets[+el.dataset.s];s.done=!s.done;
      if(s.done){if(!s.w&&s.pw)s.w=s.pw;if(!s.r)s.r=s.pr||lowReps(ACTIVE.items[+el.dataset.i].target)||"";const it=ACTIVE.items[+el.dataset.i];const rest=it.rest??(BIG.includes(it.ex)?150:90);if(rest>0)startTimer(rest);else toast("Superserie: pasa al siguiente ejercicio")}
      saveActive();render()},
    addSet:()=>{const it=ACTIVE.items[+v];const l=it.sets[it.sets.length-1];it.sets.push({w:l?l.w:"",r:"",pw:l?l.pw:"",pr:l?l.pr:"",done:false});saveActive();render()},
    rmSet:()=>{ACTIVE.items[+v].sets.pop();saveActive();render()},
    rmItem:()=>{ACTIVE.items.splice(+v,1);saveActive();render()},
    exInfo:()=>{const x=EX[v];openModal(x?`<h2>${x.n}</h2><div class="sub">${MUSCLE_ICON[x.m]} ${x.m}</div><ul class="tips">${x.t.map(t=>`<li>${t}</li>`).join("")}</ul><button class="btn block" style="margin-top:14px" data-act="closeModal">Cerrar</button>`:`<h2>${esc(exName(v))}</h2><p class="sub">Ejercicio personalizado.</p><button class="btn block" data-act="closeModal">Cerrar</button>`)},
    finish:finishWorkout,
    cancelWorkout:()=>confirmDlg("¿Descartar este entreno? No se guardará.","Descartar",()=>{ACTIVE=null;lsSet(LS_ACTIVE,null);stopTimer();render()}),
    delWorkout:()=>confirmDlg("¿Borrar este entreno del historial?","Borrar",()=>{delWorkout(v);render()}),
    timerAdd:()=>{if(TIMER){TIMER.end+=30000;drawTimer()}}, timerStop:stopTimer,
    fday:()=>{const n=addDays(UI.foodDate,+v);if(n>today())return;UI.foodDate=n;render()},
    quickFood:()=>{const x=FREQ[+v];if(x)addFood({name:x.name,kcal:x.kcal,p:x.p||0})},
    delFood:()=>{const d=UI.foodDate;S.food[d].items.splice(+v,1);saveFood(d);render()},
    pview:()=>{UI.progView=v;render()},
    pview2:()=>{UI.tab="progreso";UI.progView="peso";render();window.scrollTo(0,0)},
    cardio:()=>logCardio(v,el.dataset.m),
    cardioSave:()=>{const m=r0(num(document.getElementById("cmin").value)||0);const ce=document.getElementById("cextra");
      saveWorkout({id:uidGen(),type:"cardio",name:v,date:today(),end:Date.now(),dur:m,items:[]});
      if(ce&&ce.checked){const d=today();const f=S.food[d]||(S.food[d]={date:d,items:[],extra:0});f.extra=(+f.extra||0)+250;saveFood(d)}
      closeModal();render();toast("Cardio guardado ✓")},
    progRestart:()=>{S.main.program.start=weekStart();saveMain();render()},
    progStop:()=>confirmDlg("¿Quitar el calendario de 8 semanas? Tus rutinas se mantienen.","Quitar",()=>{delete S.main.program;saveMain();render()}),
    delBW:()=>confirmDlg("¿Borrar este registro de peso?","Borrar",()=>{S.main.bw=S.main.bw.filter(b=>b.d!==v);saveMain();render()}),
    gm:()=>{UI.guideM=UI.guideM===v?null:v;render()},
    photoOpen, photoGo, photoAdd, photoRetry:()=>{PH.items=null;drawPhoto()},
    saveKey:()=>{const k=document.getElementById("apikey").value.trim();if(k&&!k.startsWith("sk-")){toast("Esa clave no parece correcta (empieza por sk-ant-)");return}setKey(k);toast(k?"Clave guardada ✓":"Clave borrada");if(v==="photo"&&k)photoOpen();else if(v==="photo")closeModal()},
    confirmYes:()=>{const f=CONFIRM_FN;CONFIRM_FN=null;closeModal();f&&f()},
    exportData:async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast("Copia copiada al portapapeles ✓")}catch(_){const t=document.getElementById("impTxt");t.style.display="block";t.value=JSON.stringify(S);t.select();toast("Selecciona y copia el texto")}},
    importOpen:()=>{document.getElementById("impTxt").style.display="block";document.getElementById("impBtn").style.display="block";const f=document.getElementById("impFile");f.style.display="block";f.onchange=async()=>{const file=f.files[0];if(!file)return;document.getElementById("impTxt").value=await file.text();toast("Archivo cargado: pulsa Restaurar copia")}},
    downloadData:async()=>{try{localStorage.setItem("mientrenador_lastbk",Date.now())}catch(e){};const data=JSON.stringify(S);const name="entrenador-copia-"+today()+".json";
      try{const file=new File([data],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)},
    importData:()=>{try{const d=JSON.parse(document.getElementById("impTxt").value);if(!d.main)throw 0;S={main:d.main,workouts:d.workouts||{},food:d.food||{}};saveMain();Object.values(S.workouts).forEach(w=>writeDoc("w_"+w.id,w));Object.keys(S.food).forEach(k=>writeDoc("f_"+k,S.food[k]));closeModal();render();toast("Datos restaurados ✓")}catch(_){toast("Esa copia no es válida")}},
  };
  A[a]&&A[a]();
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.in&&ACTIVE){const s=ACTIVE.items[+t.dataset.i].sets[+t.dataset.s];s[t.dataset.in]=t.value;saveActive()}
  if(t.dataset.ph&&PH&&PH.items){const it=PH.items[+t.dataset.i];const f=t.dataset.ph;it[f]=f==="on"?t.checked:f==="nombre"?t.value:(num(t.value)||0);photoTotal()}
  if(t.dataset.ein&&EDIT){const it=EDIT.items[+t.dataset.k];const f=t.dataset.ein;it[f]=f==="sets"?Math.max(1,Math.min(10,parseInt(t.value)||1)):f==="rest"?(t.value===""?null:Math.max(0,parseInt(t.value)||0)):t.value}
});

render();
initCloud();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
// recordatorio de copia cada 14 días
try{const lb=+localStorage.getItem("mientrenador_lastbk")||0;const has=Object.keys(S.workouts).length>2;if(has&&Date.now()-lb>14*864e5){setTimeout(()=>toast("💾 Hace tiempo que no haces copia: ⚙️ → Copia de seguridad"),1500)}}catch(e){}
setInterval(()=>{if(ACTIVE&&UI.tab==="entrenar"){const s=document.querySelector(".top .sub");if(s)s.textContent=`En curso · ${r0((Date.now()-ACTIVE.start)/60000)} min`}},30000);
</script>
</body>
